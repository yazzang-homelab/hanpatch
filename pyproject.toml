[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hanpatch"
version = "1.0.0"
description = "Gate-enforced game localisation pipeline (3DS reference implementation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pycryptodome>=3.15", "pillow>=9.0"]

# Shown by `pip show hanpatch` and on the package page, so the ask exists even
# for someone who never runs the CLI interactively.
[project.urls]
Homepage = "https://github.com/yazzang-homelab/hanpatch"
Source = "https://github.com/yazzang-homelab/hanpatch"
"Star this repo" = "https://github.com/yazzang-homelab/hanpatch"

[project.scripts]
hanpatch = "hanpatch.cli:main"

[tool.setuptools.packages.find]
include = ["hanpatch*"]
