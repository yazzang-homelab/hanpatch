# A pull request carrying agent-written commits needs human approvals before
# it can merge.  A pull request written entirely by people is untouched.
#
# `pull_request_target` and `issue_comment` run the workflow file from the
# base branch, so the pull request under review cannot edit its own gate.
# `pull_request_review` is deliberately absent: it runs from the merge ref,
# which the author controls.  A native Approve is picked up on the next push
# or `/approve` comment instead.
#
# This assumes `.github/workflows/**` is itself protected.  Anyone who can
# push a workflow to the base branch can forge any required status.
name: agent-approval-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# Repository-wide, not per pull request. The waiting job polls Telegram, and
# getUpdates hands each update to whichever reader asks first, so two jobs
# waiting at once would steal each other's taps. One question on the phone at a
# time; the newest one wins, and a push still cancels the question it answered.
concurrency:
  group: agent-approval
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    # The job outlives the gate itself because it waits for a tap on a phone.
    timeout-minutes: 20
    steps:
      # The default ref under pull_request_target is the base branch.  Never
      # check out the pull request head: it would hand the author control of
      # both the identity list and this gate's own code.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: python3 tools/agent_approval_ci.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 개죽이 asks the owner on Telegram when the gate is pending and waits
          # for the tap. A push cancels this job (see `concurrency` above), which
          # is what we want: the question was about a commit that is no longer
          # the head. Absent secrets simply mean no message is sent.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # A tap is recorded as an ordinary `/approve <sha>` comment by the
          # owner, so it needs the owner's own credential; the workflow's own
          # bot identity would never count toward this gate.
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
